  - platform: homeassistant
    id: sns_weather_condition
    entity_id: weather.forecast_home
    on_value:
      - then:
          - lvgl.label.update:
              id:
                - id: lbl_weather_cond
              text: !lambda |-
                return x.c_str();
          - lambda: !lambda |-
              id(weather_cond_now) = x;
          - lvgl.label.update:
              id:
                - id: lbl_weather_icon
              text: !lambda |-
                // Map Home Assistant weather condition to an MDI glyph
                if (x == "sunny") return "\U000F0599";        // weather-sunny
                if (x == "clear-night") return "\U000F0594";  // weather-night
                if (x == "partlycloudy") return "\U000F0595"; // weather-partly-cloudy
                if (x == "cloudy") return "\U000F0590";       // weather-cloudy
                if (x == "fog") return "\U000F0591";          // weather-fog
                if (x == "rainy") return "\U000F0597";        // weather-rainy
                if (x == "pouring") return "\U000F0596";      // weather-pouring
                if (x == "snowy") return "\U000F0598";        // weather-snowy
                if (x == "snowy-rainy") return "\U000F067F";  // weather-snowy-rainy
                if (x == "hail") return "\U000F0598";         // weather-snowy (approx)
                if (x == "lightning" || x == "lightning-rainy") return "\U000F067E"; // lightning-rainy
                if (x == "windy" || x == "windy-variant") return "\U000F0590";       // cloudy (approx)
                if (x == "exceptional") return "\U000F067E";  // lightning-rainy (approx)
                return "\U000F0590";                          // default: weather-cloudy
    disabled_by_default: false
    internal: true
    name: sns_weather_condition
  - platform: homeassistant
    id: sns_weather_forecast
    entity_id: sensor.hmi_weather_forecast
    attribute: forecast_compact
    on_value:
      - then:
          - lambda: !lambda |-
              id(weather_fc) = x;
              const std::string s = x;
              auto icon_for = [](const std::string &c) -> const char * {
                if (c == "sunny") return "\U000F0599";
                if (c == "clear-night") return "\U000F0594";
                if (c == "partlycloudy") return "\U000F0595";
                if (c == "cloudy") return "\U000F0590";
                if (c == "fog") return "\U000F0591";
                if (c == "rainy") return "\U000F0597";
                if (c == "pouring") return "\U000F0596";
                if (c == "snowy") return "\U000F0598";
                if (c == "snowy-rainy") return "\U000F067F";
                if (c == "hail") return "\U000F0598";
                if (c == "lightning" || c == "lightning-rainy") return "\U000F067E";
                if (c == "windy" || c == "windy-variant") return "\U000F0590";
                if (c == "exceptional") return "\U000F067E";
                return "\U000F0590";
              };
              lv_obj_t *day_l[4]  = {id(lbl_fc0_day),  id(lbl_fc1_day),  id(lbl_fc2_day),  id(lbl_fc3_day)};
              lv_obj_t *icon_l[4] = {id(lbl_fc0_icon), id(lbl_fc1_icon), id(lbl_fc2_icon), id(lbl_fc3_icon)};
              lv_obj_t *high_l[4] = {id(lbl_fc0_high), id(lbl_fc1_high), id(lbl_fc2_high), id(lbl_fc3_high)};
              lv_obj_t *low_l[4]  = {id(lbl_fc0_low),  id(lbl_fc1_low),  id(lbl_fc2_low),  id(lbl_fc3_low)};
              size_t start = 0;
              for (int i = 0; i < 4; i++) {
                size_t sep = s.find(';', start);
                std::string item = (sep == std::string::npos) ? s.substr(start) : s.substr(start, sep - start);
                std::string f[4];
                size_t p = 0; int fi = 0;
                while (fi < 4) {
                  size_t q = item.find('|', p);
                  if (q == std::string::npos) { f[fi++] = item.substr(p); break; }
                  f[fi++] = item.substr(p, q - p); p = q + 1;
                }
                if (!f[0].empty()) {
                  lv_label_set_text(day_l[i], f[0].c_str());
                  lv_label_set_text(icon_l[i], icon_for(f[1]));
                  lv_label_set_text(high_l[i], (f[2] + "\u00B0").c_str());
                  lv_label_set_text(low_l[i], (f[3] + "\u00B0").c_str());
                  if (i == 0) {
                    std::string mm = f[3] + "\u00B0 / " + f[2] + "\u00B0";
                    lv_label_set_text(id(lbl_weather_minmax), mm.c_str());
                    lv_label_set_text(id(lbl_ep_today_max), (f[2] + "\u00B0").c_str());
                    lv_label_set_text(id(lbl_ep_today_min), (f[3] + "\u00B0").c_str());
                  } else if (i == 1) {
                    lv_label_set_text(id(lbl_ep_tomorrow_max), (f[2] + "\u00B0").c_str());
                    lv_label_set_text(id(lbl_ep_tomorrow_min), (f[3] + "\u00B0").c_str());
                  }
                }
                if (sep == std::string::npos) break;
                start = sep + 1;
              }
    disabled_by_default: false
    internal: true
    name: sns_weather_forecast
