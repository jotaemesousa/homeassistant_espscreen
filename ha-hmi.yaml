              - then:
                  - lvgl.widget.show:
                      - id: power_menu
        - obj:
            id: power_menu
            hidden: true
            align: LV_ALIGN_CENTER
            width: 280
            height: 210
            bg_color: 209482
            bg_opa: 1.0
            radius: 8
            border_width: 2
            border_color: 3116248
            pad_all: 12
            layout:
              type: flex
              flex_flow: LV_FLEX_FLOW_COLUMN
              flex_align_main: LV_FLEX_ALIGN_SPACE_EVENLY
              flex_align_cross: LV_FLEX_ALIGN_CENTER
              flex_align_track: LV_FLEX_ALIGN_START
            widgets:
              - label:
                  text: Energia
                  text_color: 16777215
              - button:
                  width: 1.0
                  height: 46
                  widgets:
                    - label:
                        align: LV_ALIGN_CENTER
                        text: 󰜉 Reiniciar
                  on_press:
                    - then:
                        - lvgl.widget.hide:
                            - id: power_menu
                        - button.press:
                            id: button_reboot
              - button:
                  width: 1.0
                  height: 46
                  widgets:
                    - label:
                        align: LV_ALIGN_CENTER
                        text: 󰐥 Desligar
                  on_press:
                    - then:
                        - lvgl.widget.hide:
                            - id: power_menu
                        - script.execute:
                            id: power_off_sequence
              - button:
                  width: 1.0
                  height: 40
                  widgets:
                    - label:
                        align: LV_ALIGN_CENTER
                        text: Cancelar
                  on_press:
                    - then:
                        - lvgl.widget.hide:
                            - id: power_menu
        - obj:
            id: epaper_menu
            hidden: true
            align: LV_ALIGN_CENTER
            width: 300
            height: 240
            bg_color: 209482
            bg_opa: 1.0
            radius: 8
            border_width: 2
            border_color: 3116248
            pad_all: 12
            layout:
              type: flex
              flex_flow: LV_FLEX_FLOW_COLUMN
              flex_align_main: LV_FLEX_ALIGN_SPACE_EVENLY
              flex_align_cross: LV_FLEX_ALIGN_CENTER
              flex_align_track: LV_FLEX_ALIGN_START
            widgets:
              - label:
                  text: Papel
                  text_color: 16777215
              - button:
                  width: 1.0
                  height: 44
                  widgets:
                    - label:
                        align: LV_ALIGN_CENTER
                        text: Lista de Compras
                  on_press:
                    - then:
                        - lvgl.widget.hide:
                            - id: epaper_menu
                        - lvgl.page.show:
                            lvgl_id: lvgl_epaper_id
                            id: ep_shopping
                            animation: LV_SCREEN_LOAD_ANIM_NONE
                            time: 50ms
                        - lvgl.resume:
                            lvgl_id: lvgl_epaper_id
                        - lvgl.widget.redraw:
                            lvgl_id: lvgl_epaper_id
                        - delay: 100ms
                        - component.update:
                            id: epaper_disp
              - button:
                  width: 1.0
                  height: 44
                  widgets:
                    - label:
                        align: LV_ALIGN_CENTER
                        text: Refeições & Tempo
                  on_press:
                    - then:
                        - lvgl.widget.hide:
                            - id: epaper_menu
                        - lvgl.page.show:
                            lvgl_id: lvgl_epaper_id
                            id: ep_info
                            animation: LV_SCREEN_LOAD_ANIM_NONE
                            time: 50ms
                        - lvgl.resume:
                            lvgl_id: lvgl_epaper_id
                        - lvgl.widget.redraw:
                            lvgl_id: lvgl_epaper_id
                        - delay: 100ms
                        - component.update:
                            id: epaper_disp
              - button:
                  width: 1.0
                  height: 38
                  widgets:
                    - label:
                        align: LV_ALIGN_CENTER
                        text: Cancelar
                  on_press:
                    - then:
                        - lvgl.widget.hide:
                            - id: epaper_menu
        - obj:
            id: boot_screen
            x: 0
            y: 0
            width: 1.0
            height: 1.0
            bg_color: 16777215
            bg_opa: 1.0
            radius: 0
            pad_all: 0
            border_width: 0
            widgets:
              - image:
                  align: LV_ALIGN_CENTER
                  src: boot_logo
                  y: -40
              - spinner:
                  align: LV_ALIGN_CENTER
                  y: 95
                  height: 50
                  width: 50
                  spin_time: 1s
                  arc_length: 60
                  arc_width: 8
                  indicator:
                    arc_color: 1621234
                    arc_width: 8
            on_press:
              - then:
                  - lvgl.widget.hide:
                      - id: boot_screen
