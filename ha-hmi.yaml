substitutions:
  I2SOUT_SAMPLE_RATE: 48000
  I2SIN_SAMPLE_RATE: 16000
  voice_assist_idle_phase_id: '1'
  voice_assist_listening_phase_id: '2'
  voice_assist_thinking_phase_id: '3'
  voice_assist_replying_phase_id: '4'
  voice_assist_not_ready_phase_id: '10'
  voice_assist_error_phase_id: '11'
  voice_assist_muted_phase_id: '12'
  LCD_CS: GPIO40
  LCD_DC: GPIO42
  LCD_RESET: GPIO39
  LCD_TOUCH_CS: GPIO18
  LCD_SDO: GPIO47
  LCD_SDI: GPIO41
  LCD_SCK: GPIO38
  LCD_BL: GPIO46
  EPR_CS: GPIO16
  EPR_DC: GPIO11
  EPR_RESET: GPIO15
  EPR_BUSY: GPIO9
  EPR_SDO: GPIO10
  EPR_SCK: GPIO17
  EPR_DETECT: GPIO1
  LED_ADDRESSABLE: GPIO48
  I2SOUT_DO: GPIO12
  I2SOUT_LRCLK: GPIO14
  I2SOUT_BCLK: GPIO13
  I2SIN_SD: GPIO7
  I2SIN_SCK: GPIO6
  I2SIN_WS: GPIO5
  BUTTON1: GPIO0
  PIR: GPIO2
  BATTERY_VOLTAGE: GPIO4
  ENABLE_3V3: GPIO21
  TOUCH_BUTTON: GPIO3
  IR_TX: GPIO8
  IR_RX: GPIO20
  NUM_LEDS: '6'
esphome:
  on_boot:
    - priority: 600.0
      then:
        - lambda: !lambda |-
            gpio_hold_dis(GPIO_NUM_21);
            gpio_deep_sleep_hold_dis();
        - light.turn_on:
            id: back_light
            state: true
        - delay: 8s
        - lvgl.widget.hide:
            - id: boot_screen
        - script.execute:
            id: idle_deep_sleep
        - light.turn_on:
            id: led_strip
            blue: 0.0
            red: 0.6
            green: 0.1
            brightness: 0.5
            effect: scanning
            state: true
        - delay: 30s
        - if:
            condition:
              lambda: !lambda |-
                return id(init_in_progress);
            then:
              - lambda: !lambda |-
                  id(init_in_progress) = false;
              - light.turn_off:
                  id: led_strip
                  state: false
  name: ha-hmi
  friendly_name: Home Assistant Control HMI
  name_add_mac_suffix: false
  min_version: 2026.10.1
  build_path: build/ha-hmi
  platformio_options: {}
  build_flags: []
  environment_variables: {}
  includes: []
  includes_c: []
  libraries: []
  merge_warnings: true
  debug_scheduler: false
  suspend_loop: false
  areas: []
  devices: []
esp32:
  framework:
    type: esp-idf
    version: 5.5.6
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: y
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: y
      CONFIG_SPIRAM_RODATA: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: y
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: y
      CONFIG_ESP_BROWNOUT_DET: y
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: y
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: y
      CONFIG_ESP_CONSOLE_UART_DEFAULT: y
      CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG: n
      CONFIG_ESP_CONSOLE_SECONDARY_NONE: n
    log_level: ERROR
    advanced:
      compiler_optimization: SIZE
      enable_idf_experimental_features: false
      enable_lwip_assert: true
      ignore_efuse_custom_mac: false
      ignore_efuse_mac_crc: false
      sram1_as_iram: false
      enable_lwip_mdns_queries: true
      enable_lwip_bridge_interface: false
      enable_lwip_tcpip_core_locking: true
      enable_lwip_check_thread_safety: true
      disable_libc_locks_in_iram: true
      disable_vfs_support_termios: true
      disable_vfs_support_select: true
      disable_vfs_support_dir: true
      freertos_in_iram: false
      ringbuf_in_iram: false
      heap_in_iram: false
      execute_from_psram: false
      loop_task_stack_size: 8192
      enable_ota_rollback: true
      enable_ota_downgrade_protection: false
      use_full_certificate_bundle: false
      include_builtin_idf_components: []
      enable_full_printf: false
      disable_debug_stubs: true
      disable_ocd_aware: true
      disable_usb_serial_jtag_secondary: true
      disable_dev_null_vfs: true
      disable_mbedtls_peer_cert: true
      disable_mbedtls_pkcs7: true
      disable_mbedtls_tls: true
      disable_mbedtls_tls_server: true
      disable_mbedtls_tls_extras: true
      disable_regi2c_in_iram: true
      adc_oneshot_in_iram: false
      disable_fatfs: true
    components: []
  board: 4d_systems_esp32s3_gen4_r8n16
  cpu_frequency: 240MHZ
  flash_size: 16MB
  watchdog_timeout: 5s
  variant: ESP32S3
globals:
  - id: init_in_progress
    type: bool
    restore_value: false
    initial_value: 'true'
  - id: voice_assistant_phase
    type: int
    restore_value: false
    initial_value: '10'
  - id: is_tts_active
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: question_flag
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: last_wake_word
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: groc_active
    type: std::vector<std::string>
    restore_value: false
  - id: groc_catalog
    type: std::vector<std::string>
    restore_value: false
  - id: rail_was_off
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: epaper_mode
    type: int
    restore_value: true
    initial_value: '0'
    update_interval: 1s
  - id: meal_today
    type: std::string
    restore_value: false
  - id: meal_tomorrow
    type: std::string
    restore_value: false
  - id: weather_temp_now
    type: float
    restore_value: false
    initial_value: '0'
  - id: weather_cond_now
    type: std::string
    restore_value: false
  - id: weather_fc
    type: std::string
    restore_value: false
logger:
  baud_rate: 115200
  hardware_uart: UART0
  level: DEBUG
  tx_buffer_size: 512
  deassert_rts_dtr: false
  task_log_buffer_size: 768
  logs: {}
  runtime_tag_levels: false
api:
  encryption:
    key: <removed>
  on_client_connected:
    then:
      - if:
          condition:
            lambda: !lambda |-
              return (0 == client_info.find("Home Assistant "));
          then:
            - lvgl.widget.show:
                - id: lbl_hastatus
  on_client_disconnected:
    then:
      - if:
          condition:
            lambda: !lambda |-
              return (0 == client_info.find("Home Assistant "));
          then:
            - lvgl.widget.hide:
                - id: lbl_hastatus
  actions:
    - action: start_va
      then:
        - voice_assistant.start:
            silence_detection: true
            wake_word: ''
      variables: {}
      supports_response: none
    - action: stop_va
      then:
        - voice_assistant.stop: {}
      variables: {}
      supports_response: none
  port: 6053
  reboot_timeout: 15min
  batch_delay: 100ms
  custom_services: false
  homeassistant_services: false
  homeassistant_states: false
  listen_backlog: 4
  max_connections: 5
  max_send_queue: 8
ota:
  - platform: web_server
  - platform: esphome
    password: <removed>
    version: 2
    port: 3232
    allow_partition_access: false
wifi:
  fast_connect:
    enabled: true
    storage: flash
  on_connect:
    then:
      - light.turn_off:
          id: led_strip
          state: false
  on_disconnect:
    then:
      - light.turn_on:
          id: led_strip
          blue: 0.0
          red: 1.0
          green: 0.0
          brightness: 0.98
          effect: Fast Pulse
          state: true
  ap:
    ssid: <removed>
    password: <removed>
    ap_timeout: 90s
  domain: .local
  reboot_timeout: 15min
  power_save_mode: LIGHT
  enable_btm: false
  enable_rrm: false
  passive_scan: false
  enable_on_boot: true
  post_connect_roaming: true
  min_auth_mode: WPA2
  networks:
    - ssid: !secret 'wifi_ssid'
      password: !secret 'wifi_password'
      priority: 0
  use_address: ha-hmi.local
captive_portal:
  compression: gzip
psram:
  mode: octal
  speed: 80MHZ
  enable_ecc: false
  disabled: false
  ignore_not_found: true
sensor:
  - platform: wifi_signal
    name: WiFi Signal
    id: wifi_signal_dbm
    update_interval: 60s
    disabled_by_default: false
    force_update: false
    unit_of_measurement: dBm
    accuracy_decimals: 0
    device_class: signal_strength
    state_class: measurement
    entity_category: diagnostic
  - platform: adc
    pin:
      number: 4
      mode:
        input: true
        output: false
        open_drain: false
        pullup: false
        pulldown: false
      inverted: false
      ignore_pin_validation_error: false
      ignore_strapping_warning: false
      drive_strength: 20.0
    name: Battery Voltage
    id: battery_voltage
    attenuation: 12db
    update_interval: 60s
    filters:
      - multiply: 1.58
      - calibrate_linear:
          datapoints:
            - from: 0.0
              to: 0.0
            - from: 3.2
              to: 4.2
          method: least_squares
    disabled_by_default: false
    force_update: false
    unit_of_measurement: V
    accuracy_decimals: 2
    device_class: voltage
    state_class: measurement
    raw: false
    samples: 1
    sampling_mode: avg
  - platform: template
    name: Battery Percentage
    id: battery_percentage
    lambda: !lambda |-
      float voltage = id(battery_voltage).state;
      // Map 3.3V (empty) to 4.2V (full)
      if (voltage >= 4.2) return 100.0;
      if (voltage <= 3.3) return 0.0;
      return (voltage - 3.3) * (100.0 / (4.2 - 3.3));
    unit_of_measurement: '%'
    update_interval: 60s
    on_value:
      - then:
          - lvgl.label.update:
              id:
                - id: lbl_battery_status
              text: !lambda |-
                static char buf[16];
                std::string icon;
                if (x == 100.0) {
                    icon = "\U000F0079";  // mdi-battery (full)
                } else if (x > 90) {
                    icon = "\U000F0082"; // mdi-battery-90
                } else if (x > 80) {
                    icon = "\U000F0081"; // mdi-battery-80
                } else if (x > 70) {
                    icon = "\U000F0080"; // mdi-battery-70
                } else if (x > 60) {
                    icon = "\U000F007F"; // mdi-battery-60
                } else if (x > 50) {
                    icon = "\U000F007E"; // mdi-battery-50
                } else if (x > 40) {
                    icon = "\U000F007D"; // mdi-battery-40
                } else if (x > 30) {
                    icon = "\U000F007C"; // mdi-battery-30
                } else if (x > 20) {
                    icon = "\U000F007B"; // mdi-battery-20
                } else if (x > 10) {
                    icon = "\U000F007A"; // mdi-battery-10
                } else if (x > 0) {
                    icon = "\U000F008E"; // mdi-battery-outline
                } else {
                    icon = "\U000F0091"; // mdi-battery-unknown
                }
                snprintf(buf, sizeof(buf), "%s %d%%", icon.c_str(), (int)round(x));
                return buf;
    disabled_by_default: false
    force_update: false
    accuracy_decimals: 1
  - platform: homeassistant
    id: sns_weather_temperature
    entity_id: weather.forecast_home
    attribute: temperature
    on_value:
      - then:
          - lvgl.label.update:
              id:
                - id: lbl_weather_temp
              text: !lambda |-
                static char buf[12];
                snprintf(buf, sizeof(buf), "%.0f°", x);
                return buf;
          - lambda: !lambda |-
              id(weather_temp_now) = x;
              char b[16];
              snprintf(b, sizeof(b), "%.0f\u00B0C", x);
              lv_label_set_text(id(lbl_ep_weather_now), b);
    disabled_by_default: false
    force_update: false
    accuracy_decimals: 1
    internal: true
    name: sns_weather_temperature
  - platform: homeassistant
    id: sns_weather_humidity
    entity_id: weather.forecast_home
    attribute: humidity
    on_value:
      - then:
          - lvgl.label.update:
              id:
                - id: lbl_weather_humidity
              text: !lambda |-
                static char buf[24];
                snprintf(buf, sizeof(buf), "\U000F058E %.0f%%", x);
                return buf;
    disabled_by_default: false
    force_update: false
    accuracy_decimals: 1
    internal: true
    name: sns_weather_humidity
  - platform: homeassistant
    id: sns_weather_wind
    entity_id: weather.forecast_home
    attribute: wind_speed
    on_value:
      - then:
          - lvgl.label.update:
              id:
                - id: lbl_weather_wind
              text: !lambda |-
                static char buf[28];
                snprintf(buf, sizeof(buf), "\U000F059D %.0f km/h", x);
                return buf;
    disabled_by_default: false
    force_update: false
    accuracy_decimals: 1
    internal: true
    name: sns_weather_wind
  - platform: homeassistant
    id: sns_outside_temperature
    entity_id: sensor.meshtastic_jms1_1800938498_environment_temperature
    on_value:
      - then:
          - lvgl.label.update:
              id:
                - id: lbl_weather_outside
              text: !lambda |-
                static char buf[24];
                snprintf(buf, sizeof(buf), "\U000F050F %.1f°", x);
                return buf;
    disabled_by_default: false
    force_update: false
    accuracy_decimals: 1
    internal: true
    name: sns_outside_temperature
time:
  - platform: sntp
    on_time:
      - hours:
          - 2
          - 3
          - 4
          - 5
        minutes:
          - 5
        seconds:
          - 0
        then:
          - switch.turn_on:
              id: switch_antiburn
      - hours:
          - 2
          - 3
          - 4
          - 5
        minutes:
          - 35
        seconds:
          - 0
        then:
          - switch.turn_off:
              id: switch_antiburn
    update_interval: 15min
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org
  - platform: homeassistant
    id: ha_time
    update_interval: 15min
light:
  - platform: esp32_rmt_led_strip
    id: led_strip
    name: ''
    disabled_by_default: true
    entity_category: config
    pin:
      number: 48
      mode:
        output: true
        input: false
        open_drain: false
        pullup: false
        pulldown: false
      inverted: false
      ignore_pin_validation_error: false
      ignore_strapping_warning: false
      drive_strength: 20.0
    default_transition_length: 0s
    chipset: SK6812
    num_leds: 6
    rmt_symbols: 48
    effects:
      - pulse:
          name: Slow Pulse
          transition_length: 250ms
          update_interval: 250ms
          min_brightness: 0.5
          max_brightness: 1.0
      - pulse:
          name: Fast Pulse
          transition_length: 100ms
          update_interval: 100ms
          min_brightness: 0.5
          max_brightness: 1.0
      - addressable_scan:
          name: Scanning
          move_interval: 120ms
          scan_width: 1
      - pulse:
          name: Waiting for wake word
          min_brightness: 0.15
          max_brightness: 0.35
          transition_length: 3s
          update_interval: 3s
    resume_effect: false
    gamma_correct: 2.8
    flash_transition_length: 0s
    use_psram: true
    reset_high: 0us
    reset_low: 0us
    channel_colors: GRB
  - platform: monochromatic
    output: LedLcd
    icon: mdi:television
    name: Display Backlight
    id: back_light
    restore_mode: ALWAYS_ON
    disabled_by_default: false
    resume_effect: false
    gamma_correct: 2.8
    default_transition_length: 1s
    flash_transition_length: 0s
button:
  - platform: restart
    name: reboot
    id: button_reboot
    disabled_by_default: false
    icon: mdi:restart
    entity_category: config
    device_class: restart
  - platform: template
    name: TV Power
    id: ir_tv_power
    icon: mdi:power
    on_press:
      - then:
          - remote_transmitter.transmit_samsung:
              data: 0xE0E040BF
              nbits: 32
    disabled_by_default: false
  - platform: template
    name: TV Volume Up
    id: ir_tv_volume_up
    icon: mdi:volume-plus
    on_press:
      - then:
          - remote_transmitter.transmit_samsung:
              data: 0xE0E0E01F
              nbits: 32
    disabled_by_default: false
  - platform: template
    name: TV Volume Down
    id: ir_tv_volume_down
    icon: mdi:volume-minus
    on_press:
      - then:
          - remote_transmitter.transmit_samsung:
              data: 0xE0E0D02F
              nbits: 32
    disabled_by_default: false
  - platform: template
    name: TV Mute
    id: ir_tv_mute
    icon: mdi:volume-mute
    on_press:
      - then:
          - remote_transmitter.transmit_samsung:
              data: 0xE0E0F00F
              nbits: 32
    disabled_by_default: false
  - platform: template
    name: TV Channel Up
    id: ir_tv_channel_up
    icon: mdi:arrow-up-bold
    on_press:
      - then:
          - remote_transmitter.transmit_samsung:
              data: 0xE0E048B7
              nbits: 32
    disabled_by_default: false
  - platform: template
    name: TV Channel Down
    id: ir_tv_channel_down
    icon: mdi:arrow-down-bold
    on_press:
      - then:
          - remote_transmitter.transmit_samsung:
              data: 0xE0E008F7
              nbits: 32
    disabled_by_default: false
  - platform: template
    name: TV Source
    id: ir_tv_source
    icon: mdi:import
    on_press:
      - then:
          - remote_transmitter.transmit_samsung:
              data: 0xE0E0807F
              nbits: 32
    disabled_by_default: false
  - platform: template
    name: Add E-paper
    id: add_epaper
    icon: mdi:book-open-page-variant
    entity_category: config
    on_press:
      - then:
          - script.execute:
              id: reinit_epaper
    disabled_by_default: false
image:
  - platform: file
    file: /data/image/ec9f243e
    id: boot_logo
    resize:
      - 200
      - 200
    type: RGB565
    transparency: alpha_channel
    dither: NONE
    invert_alpha: false
    byte_order: LITTLE_ENDIAN
switch:
  - platform: gpio
    name: Enable 3.3V
    id: enable_3v3
    pin:
      number: 21
      mode:
        output: true
        input: false
        open_drain: false
        pullup: false
        pulldown: false
      inverted: false
      ignore_pin_validation_error: false
      ignore_strapping_warning: false
      drive_strength: 20.0
    inverted: true
    restore_mode: ALWAYS_ON
    on_turn_off:
      - then:
          - lambda: !lambda |-
              id(rail_was_off) = true;
    on_turn_on:
      - then:
          - if:
              condition:
                lambda: !lambda |-
                  return id(rail_was_off);
              then:
                - lambda: !lambda |-
                    id(rail_was_off) = false;
                - delay: 100ms
                - script.execute:
                    id: reinit_displays
    disabled_by_default: false
    interlock_wait_time: 0ms
  - platform: template
    name: Antiburn
    id: switch_antiburn
    icon: mdi:television-shimmer
    optimistic: true
    entity_category: config
    turn_on_action:
      then:
        - logger.log:
            format: Starting Antiburn
            args: []
            level: DEBUG
            tag: main
        - if:
            condition:
              lvgl.is_paused:
                lvgl_id: lvgl_lcd_id
            then:
              - lvgl.resume:
                  lvgl_id: lvgl_lcd_id
              - lvgl.widget.redraw:
                  lvgl_id: lvgl_lcd_id
        - lvgl.pause:
            show_snow: true
            lvgl_id: lvgl_lcd_id
    turn_off_action:
      then:
        - logger.log:
            format: Stopping Antiburn
            args: []
            level: DEBUG
            tag: main
        - if:
            condition:
              lvgl.is_paused:
                lvgl_id: lvgl_lcd_id
            then:
              - lvgl.resume:
                  lvgl_id: lvgl_lcd_id
              - lvgl.widget.redraw:
                  lvgl_id: lvgl_lcd_id
    disabled_by_default: false
    restore_mode: ALWAYS_OFF
    assumed_state: false
  - platform: template
    name: Enable Voice Assistant
    id: voice_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    icon: mdi:assistant
    on_turn_on:
      - then:
          - if:
              condition:
                lambda: !lambda |-
                  return !id(init_in_progress);
              then:
                - lambda: !lambda |-
                    id(voice_assistant_phase) = 1;
                - lvgl.widget.update:
                    id:
                      - id: voice_toggle_btn
                    state:
                      checked: true
                - if:
                    condition:
                      not:
                        and:
                          - voice_assistant.is_running: {}
                    then:
                      - micro_wake_word.start: {}
                      - light.turn_on:
                          id: led_strip
                          blue: 0.15
                          red: 0.0
                          green: 0.15
                          brightness: 0.2
                          effect: Slow Pulse
                          state: true
    on_turn_off:
      - then:
          - if:
              condition:
                lambda: !lambda |-
                  return !id(init_in_progress);
              then:
                - voice_assistant.stop: {}
                - micro_wake_word.stop: {}
                - lambda: !lambda |-
                    id(voice_assistant_phase) = 12;
                - lvgl.widget.update:
                    id:
                      - id: voice_toggle_btn
                    state:
                      checked: false
                - light.turn_off:
                    id: led_strip
                    state: false
    disabled_by_default: false
    assumed_state: false
  - platform: template
    name: Ring Timer
    id: timer_ringing
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_turn_off:
      - then:
          - media_player.stop:
              id: external_media_player
              announcement: true
    on_turn_on:
      - then:
          - while:
              condition:
                switch.is_on:
                  id: timer_ringing
              then:
                - media_player.speaker.play_on_device_media_file:
                    id: external_media_player
                    media_file: alarm_sound
                    announcement: true
                    enqueue: false
                - wait_until:
                    condition:
                      media_player.is_announcing:
                        id: external_media_player
                - wait_until:
                    condition:
                      not:
                        media_player.is_announcing:
                          id: external_media_player
                - delay: 1000ms
    disabled_by_default: false
    assumed_state: false
  - platform: template
    name: Continued Conversation
    id: continued_conversation_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    icon: mdi:chat-processing-outline
