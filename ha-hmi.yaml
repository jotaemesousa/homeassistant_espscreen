        bg_opa: 0.15
        indicator:
          bg_color: 1925014
          bg_grad_color: 209482
          bg_grad_dir: LV_GRAD_DIR_VER
          bg_opa: 1.0
        knob:
          bg_color: 3116248
          bg_grad_color: 22402
          bg_grad_dir: LV_GRAD_DIR_VER
          bg_opa: 1.0
          border_color: 30643
          border_width: 1
          text_color: 16777215
