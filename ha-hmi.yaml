    style_definitions:
      - id: header_footer
        bg_color: 3116248
        bg_grad_color: 22402
        bg_grad_dir: LV_GRAD_DIR_VER
        bg_opa: 1.0
        border_opa: 0.0
        radius: 0
        pad_all: 0
