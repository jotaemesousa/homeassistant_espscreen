            bg_grad_color: 14532185
            text_color: 0
          checked:
            bg_color: 5350012
            bg_grad_color: 5350034
            text_color: 16773888
      switch:
        bg_color: 12632256
        bg_grad_color: 11579568
        bg_grad_dir: LV_GRAD_DIR_VER
        bg_opa: 1.0
        checked:
          bg_color: 1925014
          bg_grad_color: 209482
          bg_grad_dir: LV_GRAD_DIR_VER
          bg_opa: 1.0
        knob:
          bg_color: 16777215
          bg_grad_color: 12632256
          bg_grad_dir: LV_GRAD_DIR_VER
          bg_opa: 1.0
      slider:
        border_width: 1
        border_opa: 0.15
