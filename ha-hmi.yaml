text_sensor:
  - platform: homeassistant
    id: sns_grocery_active
    entity_id: sensor.hmi_grocery_list
    attribute: active
    on_value:
      - then:
          - lambda: !lambda |-
              id(groc_active).clear();
              std::string s = x;
              size_t start = 0;
              while (start <= s.size()) {
                size_t nl = s.find('\n', start);
                std::string item = (nl == std::string::npos) ? s.substr(start) : s.substr(start, nl - start);
                if (!item.empty() && item.back() == '\r') item.pop_back();
                if (!item.empty()) id(groc_active).push_back(item);
                if (nl == std::string::npos) break;
                start = nl + 1;
              }
              lv_obj_t *rows[10]   = {id(groc_row_0), id(groc_row_1), id(groc_row_2), id(groc_row_3), id(groc_row_4), id(groc_row_5), id(groc_row_6), id(groc_row_7), id(groc_row_8), id(groc_row_9)};
              lv_obj_t *labels[10] = {id(lbl_groc_0), id(lbl_groc_1), id(lbl_groc_2), id(lbl_groc_3), id(lbl_groc_4), id(lbl_groc_5), id(lbl_groc_6), id(lbl_groc_7), id(lbl_groc_8), id(lbl_groc_9)};
              for (int i = 0; i < 10; i++) {
                if ((size_t) i < id(groc_active).size()) {
                  lv_label_set_text(labels[i], id(groc_active)[i].c_str());
                  lv_obj_clear_flag(rows[i], LV_OBJ_FLAG_HIDDEN);
                } else {
                  lv_obj_add_flag(rows[i], LV_OBJ_FLAG_HIDDEN);
                }
              }
              // Mirror the active list onto the e-paper shopping view.
              std::string ep;
              for (size_t i = 0; i < id(groc_active).size(); i++) {
                if (i) ep += "\n";
                ep += "- " + id(groc_active)[i];
              }
              lv_label_set_text(id(lbl_ep_shopping), ep.empty() ? "(lista vazia)" : ep.c_str());
    disabled_by_default: false
    internal: true
    name: sns_grocery_active
