number:
  - platform: template
    name: Deep sleep timeout
    optimistic: true
    id: deep_sleep_timeout
    unit_of_measurement: min
    initial_value: 5.0
    restore_value: true
    min_value: 1.0
    max_value: 60.0
    step: 1.0
    mode: BOX
    disabled_by_default: false
    update_interval: 60s
  - platform: template
    name: LVGL Screen timeout
    optimistic: true
    id: display_timeout
    unit_of_measurement: s
    initial_value: 60.0
    restore_value: true
    min_value: 10.0
    max_value: 180.0
    step: 5.0
    mode: BOX
    disabled_by_default: false
    update_interval: 60s
  - platform: template
    name: Decibel Reduction
    id: ducking_decibel
    min_value: 0.0
    max_value: 12.0
    step: 1.0
    initial_value: 0.0
    unit_of_measurement: dB
    set_action:
      then:
        - mixer_speaker.apply_ducking:
            id: media_mixing_input
            decibel_reduction: !lambda |-
              return (int)x;
            duration: 200ms
    disabled_by_default: false
    mode: AUTO
    optimistic: false
    update_interval: 60s
deep_sleep:
  id: deep_sleep_1
  touch_wakeup: true
  esp32_ext1_wakeup:
    mode: ANY_LOW
    pins:
      - pin:
          number: 0
          mode:
            input: true
            output: false
            open_drain: false
            pullup: false
            pulldown: false
          inverted: false
          ignore_pin_validation_error: false
          ignore_strapping_warning: false
          drive_strength: 20.0
script:
  - id: idle_deep_sleep
    mode: restart
    then:
      - delay: !lambda |-
          return (uint32_t) id(deep_sleep_timeout).state * 60000;
      - script.execute:
          id: power_off_sequence
    parameters: {}
  - id: wake_display
    mode: single
    then:
      - if:
          condition:
            lvgl.is_paused:
              lvgl_id: lvgl_lcd_id
          then:
            - lvgl.resume:
                lvgl_id: lvgl_lcd_id
            - lvgl.widget.redraw:
                lvgl_id: lvgl_lcd_id
      - light.turn_on:
          id: back_light
          state: true
    parameters: {}
  - id: power_off_sequence
    mode: single
    then:
      - light.turn_off:
          id: back_light
          state: false
      - light.turn_off:
          id: led_strip
          state: false
      - switch.turn_off:
          id: enable_3v3
      - delay: 200ms
      - lambda: !lambda |-
          gpio_hold_en(GPIO_NUM_21);
          gpio_deep_sleep_hold_en();
      - deep_sleep.enter:
          id: deep_sleep_1
    parameters: {}
  - id: reinit_displays
    mode: single
    then:
      - logger.log:
          format: Re-initializing displays after 3.3V rail cycle
          args: []
          level: DEBUG
          tag: main
      - lambda: !lambda |-
          static const uint8_t init_seq[] = {
            0x01, 0x00,              // SWRESET
            150,  0xFF,              // delay 150ms
            0x11, 0x00,              // SLPOUT
            120,  0xFF,              // delay 120ms
            0x3A, 0x01, 0x66,        // PIXFMT, 18 bit
            0xE0, 0x0F, 0x00, 0x03, 0x09, 0x08, 0x16, 0x0A, 0x3F, 0x78,
                        0x4C, 0x09, 0x0A, 0x08, 0x16, 0x1A, 0x0F,
            0xE1, 0x0F, 0x00, 0x16, 0x19, 0x03, 0x0F, 0x05, 0x32, 0x45,
                        0x46, 0x04, 0x0E, 0x0D, 0x35, 0x37, 0x0F,
            0xC0, 0x02, 0x17, 0x15,  // PWCTR1
            0xC1, 0x01, 0x41,        // PWCTR2
            0xC5, 0x03, 0x00, 0x12, 0x80,  // VMCTR1
            0xB0, 0x01, 0x00,        // IFMODE
            0xB1, 0x01, 0xA0,        // FRMCTR1
            0xB4, 0x01, 0x02,        // INVCTR
            0xB6, 0x02, 0x02, 0x02,  // DFUNCTR
            0xE9, 0x01, 0x00,
            0xF7, 0x04, 0xA9, 0x51, 0x2C, 0x82,  // ADJCTL3
            0x29, 0x00,              // DISPON
          };
          id(main_display).set_init_sequence(init_seq, sizeof(init_seq));
          id(main_display).setup();
          id(epaper_disp).setup();
      - lvgl.widget.redraw:
          lvgl_id: lvgl_lcd_id
    parameters: {}
  - id: reinit_epaper
    mode: single
    then:
      - logger.log:
          format: 'E-paper reconnected: re-initializing panel'
          args: []
          level: DEBUG
          tag: main
      - delay: 150ms
      - lambda: !lambda |-
          id(epaper_disp).setup();
      - lvgl.resume:
          lvgl_id: lvgl_epaper_id
      - lvgl.widget.redraw:
          lvgl_id: lvgl_epaper_id
      - delay: 100ms
      - component.update:
          id: epaper_disp
    parameters: {}
  - id: listening_timeout
    mode: restart
    then:
      - delay: 3s
      - if:
          condition:
            lambda: !lambda |-
              return id(voice_assistant_phase) == 2;
          then:
            - light.turn_off:
                id: led_strip
                state: false
            - voice_assistant.stop: {}
            - lambda: !lambda |-
                id(voice_assistant_phase) = 1;
    parameters: {}
  - id: activate_stop_word_once
    then:
      - delay: 1s
      - if:
          condition:
            switch.is_off:
              id: timer_ringing
          then:
            - micro_wake_word.enable_model:
                id: stop
            - wait_until:
                condition:
                  not:
                    media_player.is_announcing:
                      id: external_media_player
            - if:
                condition:
                  switch.is_off:
                    id: timer_ringing
                then:
                  - micro_wake_word.disable_model:
                      id: stop
    mode: single
    parameters: {}
  - id: play_sound
    parameters:
      priority: bool
      sound_file: audio::AudioFile*
    then:
      - lambda: !lambda |-
          if (priority) {
            id(external_media_player)
              ->make_call()
              .set_command(media_player::MediaPlayerCommand::MEDIA_PLAYER_COMMAND_STOP)
              .set_announcement(true)
              .perform();
          }
          if ( (id(external_media_player).state != media_player::MediaPlayerState::MEDIA_PLAYER_STATE_ANNOUNCING ) || priority) {
            id(external_media_player)
              ->play_file(sound_file, true, false);
          }
    mode: single
