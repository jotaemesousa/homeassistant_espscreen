          bg_color: 14336627
          bg_grad_color: 14532185
          text_color: 0
        checked:
          bg_color: 5350012
          bg_grad_color: 5350034
          text_color: 16773888
      buttonmatrix:
        bg_opa: 0.0
        border_color: 30643
        border_width: 0
        text_color: 16777215
        pad_all: 0
        items:
