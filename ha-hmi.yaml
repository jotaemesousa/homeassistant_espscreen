voice_assistant:
  id: va
  microphone:
    - microphone: external_microphone
      gain_factor: 16
      channels:
        - 0
      bits_per_sample: 16
  media_player: external_media_player
  micro_wake_word: mww
  noise_suppression_level: 2
  auto_gain: 0
  volume_multiplier: 1.0
  on_client_connected:
    then:
      - lambda: !lambda |-
          id(init_in_progress) = false;
      - if:
          condition:
            switch.is_on:
              id: voice_enabled
          then:
            - micro_wake_word.start: {}
            - lambda: !lambda |-
                id(voice_assistant_phase) = 1;
          else:
            - lambda: !lambda |-
                id(voice_assistant_phase) = 12;
      - light.turn_on:
          id: led_strip
          blue: 0.1
          red: 0.1
          green: 1.0
          effect: Waiting for wake word
          state: true
      - delay: 5s
      - light.turn_off:
          id: led_strip
          state: false
  on_client_disconnected:
    then:
      - lambda: !lambda |-
          id(voice_assistant_phase) = 10;
      - micro_wake_word.stop: {}
  on_listening:
    then:
      - lambda: !lambda |-
          id(voice_assistant_phase) = 2;
          id(is_tts_active) = false;
          id(question_flag) = false;
      - light.turn_on:
          id: led_strip
          blue: 0.0
          red: 1.0
          green: 0.0
          brightness: 0.5
          effect: Fast Pulse
          state: true
      - script.execute:
          id: listening_timeout
  on_stt_vad_start:
    then:
      - script.stop:
          id: listening_timeout
  on_stt_vad_end:
    then:
      - light.turn_off:
          id: led_strip
          state: false
      - lambda: !lambda |-
          id(voice_assistant_phase) = 3;
  on_stt_end:
    then:
      - homeassistant.event:
          event: esphome.stt_text
          data:
            text: !lambda |-
              return x;
          data_template: {}
          variables: {}
  on_intent_progress:
    then:
      - if:
          condition:
            lambda: !lambda |-
              return !x.empty();
          then:
            - lambda: !lambda |-
                id(voice_assistant_phase) = 4;
            - lambda: !lambda |-
                id(is_tts_active) = true;
            - script.execute:
                id: activate_stop_word_once
  on_tts_start:
    then:
      - if:
          condition:
            lambda: !lambda |-
              return id(voice_assistant_phase) != 4;
          then:
            - lambda: !lambda |-
                id(voice_assistant_phase) = 4;
            - script.execute:
                id: activate_stop_word_once
      - lambda: !lambda |-
          bool is_question = false;
          if (!x.empty() && x.back() == '?') {
            is_question = true;
          }
          id(question_flag) = is_question;
      - if:
          condition:
            switch.is_on:
              id: extended_dialog
          then:
            - lambda: !lambda |-
                id(is_tts_active) = true;
  on_timer_finished:
    then:
      - switch.turn_on:
          id: timer_ringing
  on_end:
    then:
      - if:
          condition:
            and:
              - light.is_on:
                  id: led_strip
          then:
            - light.turn_off:
                id: led_strip
                state: false
      - wait_until:
          condition:
            and:
              - media_player.is_announcing:
                  id: external_media_player
          timeout: 500ms
      - wait_until:
          condition:
            not:
              voice_assistant.is_running: {}
      - delay: 500ms
      - if:
          condition:
            and:
              - switch.is_on:
                  id: continued_conversation_enabled
              - lambda: !lambda |-
                  return !id(question_flag);
              - lambda: !lambda |-
                  return id(is_tts_active);
              - lambda: !lambda |-
                  return id(last_wake_word) != "Stop";
          then:
            - voice_assistant.start:
                wake_word: !lambda |-
                  return id(last_wake_word);
                silence_detection: true
          else:
            - mixer_speaker.apply_ducking:
                id: media_mixing_input
                decibel_reduction: !lambda |-
                  return id(ducking_decibel).state;
                duration: 1s
            - lambda: !lambda |-
                id(voice_assistant_phase) = 1;
  on_error:
    then:
      - if:
          condition:
            lambda: !lambda |-
              return !id(init_in_progress);
          then:
            - lambda: !lambda |-
                id(voice_assistant_phase) = 11;
            - delay: 1s
            - if:
                condition:
                  switch.is_on:
                    id: voice_enabled
                then:
                  - lambda: !lambda |-
                      id(voice_assistant_phase) = 1;
                else:
                  - lambda: !lambda |-
                      id(voice_assistant_phase) = 12;
  use_wake_word: false
  conversation_timeout: 300s
micro_wake_word:
  models:
    - model:
        url: https://github.com/kahrendt/microWakeWord/releases/download/okay_nabu_20241226.3/okay_nabu.json
        type: http
      id: okay_nabu
      internal: false
    - model:
        url: https://raw.githubusercontent.com/Darkmadda/ha-v-pe/refs/heads/main/hey_glados.json
        type: http
      id: hey_glados
      internal: false
    - model:
        url: https://github.com/kahrendt/microWakeWord/releases/download/stop/stop.json
        type: http
      id: stop
      internal: true
  vad:
    model:
      url: https://github.com/esphome/micro-wake-word-models/raw/main/models/v2/vad.json
      type: http
    internal: false
  id: mww
  stop_after_detection: false
  on_wake_word_detected:
    then:
      - if:
          condition:
            switch.is_on:
              id: timer_ringing
          then:
            - switch.turn_off:
                id: timer_ringing
          else:
            - if:
                condition:
                  switch.is_on:
                    id: voice_enabled
                then:
                  - if:
                      condition:
                        voice_assistant.is_running: {}
                      then:
                        - lambda: !lambda |-
                            id(last_wake_word) = wake_word;
                        - delay: 100ms
                        - voice_assistant.stop: {}
                      else:
                        - if:
                            condition:
                              media_player.is_announcing:
                                id: external_media_player
                            then:
                              - media_player.stop:
                                  id: external_media_player
                                  announcement: true
                            else:
                              - lambda: !lambda |-
                                  id(last_wake_word) = wake_word;
                              - script.execute:
                                  id: play_sound
                                  priority: true
                                  sound_file: !lambda |-
                                    return const_cast<esphome::audio::AudioFile*>(id(beep));
                              - delay: 280ms
                              - voice_assistant.start:
                                  wake_word: !lambda |-
                                    return wake_word;
                                  silence_detection: true
  microphone:
    gain_factor: 1
    channels:
      - 0
    bits_per_sample: 16
select:
  - platform: template
    name: Wake word sensitivity
    optimistic: true
    initial_option: Slightly sensitive
    restore_value: true
    entity_category: config
    options:
      - Slightly sensitive
      - Slightly+ sensitive
      - Moderately sensitive
      - Very sensitive
    on_value:
      - then:
          - lambda: !lambda |-
              if (x == "Slightly sensitive") {
                id(okay_nabu).set_probability_cutoff(217);    // 0.85 -> 0.000 FAPH on DipCo (Manifest's default)
              } else if (x == "Slightly+ sensitive") {
                id(okay_nabu).set_probability_cutoff(191);    // 0.75
              } else if (x == "Moderately sensitive") {
                id(okay_nabu).set_probability_cutoff(176);    // 0.69 -> 0.376 FAPH on DipCo
              } else if (x == "Very sensitive") {
                id(okay_nabu).set_probability_cutoff(143);    // 0.56 -> 0.751 FAPH on DipCo
              }
    disabled_by_default: false
    update_interval: 60s
  - platform: logger
    id: logger_select
    name: Logger Level
    disabled_by_default: true
    entity_category: config
    icon: mdi:bug
